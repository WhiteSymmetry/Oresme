[workspace]
name = "oresme"
version = "0.2.0"
preview = ["pixi-build"]
channels = ["https://prefix.dev/bilgi", "pypi", "https://prefix.dev/conda-forge", "https://conda.modular.com/max-nightly", "conda-forge", "https://repo.prefix.dev/modular-community"]
platforms = ["linux-64", "win-64", "osx-64"]

[package]
name = "oresme"
version = "0.2.0"
license = "AGPL-3.0-or-later"

[dependencies]
python = ">=3.11"
pip = ">=25.3"
numba = ">=0.67.0"
conda-build = ">=25.11.1"
setuptools = ">=82.0.1"
wheel = ">=0.45.1"
setuptools_scm = ">=9.2.2"
rattler-build = ">=0.76.0"
oresme = ">=0.2.0,<0.3"

[tasks]
build = "python -m build"
start = "python -c 'import oresme; print(oresme.__version__)'"
lint = "ruff check ."
fmt = "ruff format ."
serve = { cmd = "python -m http.server", cwd = "docs" }
install-oresme = "pip install git+https://github.com/WhiteSymmetry/oresme"
install = "pip install -e ."
test = { depends-on = ["install"], cmd = "pytest" }
install-deps = "pip install oresme"

[package.build.backend]
name = "pixi-build-python"
version = "*"

[package.host-dependencies]
hatchling = "*"
